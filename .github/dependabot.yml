version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "com.crankuptheamps:amps-client"
      - dependency-name: "org.apache.flink:flink-streaming-java"
      - dependency-name: "org.apache.flink:flink-connector-base"
      - dependency-name: "org.apache.flink:flink-json"
      - dependency-name: "org.apache.flink:flink-test-utils"
      - dependency-name: "org.apache.flink:flink-clients"
      - dependency-name: "org.apache.flink:flink-table-planner-loader"
      - dependency-name: "org.apache.flink:flink-table-api-java-bridge"
